#
# This file may be used with the "include" directive in the nginx.conf
# configuration file in order to support logging the values of the 
# netacuity variables into a logfile.
#
# e.g.
#    http {
#        include netacuity_logging.conf;
#        access_log logs/access.log na_log_base;
#        access_log logs/access.log na_log_pulse;
#        access_log logs/access.log na_log_mobile;
#        access_log logs/access.log na_log_vpn_proxy;
#    }
#
