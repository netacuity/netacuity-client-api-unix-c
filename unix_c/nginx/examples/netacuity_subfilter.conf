# This file may be used with the "include" directive in the nginx.conf
# configuration file in order to support text replacements with the 
# netacuity variables.
#
# e.g. 
#    location ~ \.html$ {
#        include netacuity_subfilter.conf;
#    }
#
# e.g.
#    <html>
#      <head><title>NetAcuity Test Page for #{na_ip}</title></head>
#      <body>
#          Your Location is: 
#          #{na_pulse_city}, #{na_pulse_region}, #{na_pulse_country}
#      </body>
#    </html>
#
